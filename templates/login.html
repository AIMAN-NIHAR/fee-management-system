<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Fee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.35);
            overflow: hidden;
            background: #fff;
        }
        .login-header {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
            text-align: center;
            padding: 40px 25px 30px;
        }
        .login-header .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .login-header .icon-circle i {
            font-size: 32px;
        }
        .login-header h3 {
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .login-header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        .login-body {
            padding: 35px 35px 40px;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group-text {
            background: #f4f6f9;
            border: 1.5px solid #e5e9f2;
            border-right: none;
            color: #26d0ce;
        }
        .form-control {
            border: 1.5px solid #e5e9f2;
            border-left: none;
            padding: 11px;
            background: #f4f6f9;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #26d0ce;
            background: #fff;
        }
        .input-group:focus-within .input-group-text {
            border-color: #26d0ce;
            background: #fff;
        }
        .btn-login {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .alert {
            border-radius: 10px;
            font-size: 14px;
        }
        .footer-note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="login-header">
                <div class="icon-circle">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h3>Smart Fee System</h3>
                
            </div>
            <div class="login-body">

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger d-flex align-items-center">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="/login" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter your username" autocomplete="off" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login btn-primary w-100 text-white">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>

            </div>
        </div>
        <p class="footer-note">© 2026 Smart Fee Management System</p>
    </div>

</body>
</html>
